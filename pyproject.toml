[project]
name = "osa-myo-controller"
version = "0.1.0"
description = "OSA MYO Controller: open Myo Connect replacement for macOS (Apple Silicon). BLE driver, monitor GUI and OSC bridge for the Thalmic/North Myo armband"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniele Fabris" }, { name = "Simone Arganini" }]
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "python-osc>=1.9",
    "numpy>=1.26",
    "typer>=0.12",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13.7"]
dongle = ["pyserial>=3.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
build = ["pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/dnlfbr/OSA-MYO-Controller"
"Oscilla Creations" = "https://www.oscillacreations.com"

[project.scripts]
osa-myo = "myo_bridge.cli:app"
myo-bridge = "myo_bridge.cli:app"  # the earlier name, kept for existing scripts

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myo_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
default-groups = []
